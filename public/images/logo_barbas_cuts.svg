<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
  </defs>

  <!-- Background glow circle -->
  <circle cx="250" cy="160" r="140" fill="url(#goldGlow)" />

  <!-- Outer Cap & Head Outline -->
  <g fill="currentColor" stroke="none">
    <!-- Cap visor & crown -->
    <path d="M150 145 C150 75, 350 75, 350 145 C350 155, 150 155, 150 145 Z" />
    <path d="M130 140 C190 130, 310 130, 370 140 C380 152, 120 152, 130 140 Z" />

    <!-- Cap Logo (Scissors & A) -->
    <g transform="translate(232, 85) scale(0.7)" fill="none" stroke="#FFFFFF" stroke-width="4">
      <circle cx="10" cy="45" r="10" />
      <circle cx="40" cy="45" r="10" />
      <line x1="17" y1="38" x2="35" y2="10" />
      <line x1="33" y1="38" x2="15" y2="10" />
      <path d="M 25 5 L 12 30 L 38 30 Z" fill="#FFFFFF" />
    </g>

    <!-- Face Silhouette Frame -->
    <path d="M165 145 C165 240, 335 240, 335 145 C320 180, 180 180, 165 145 Z" fill="none" stroke="currentColor" stroke-width="8" />

    <!-- Beard -->
    <path d="M175 160 C175 250, 220 280, 250 280 C280 280, 325 250, 325 160 C325 220, 290 265, 250 265 C210 265, 175 220, 175 160 Z" />
    
    <!-- Mustache -->
    <path d="M210 185 C230 180, 245 195, 250 200 C255 195, 270 180, 290 185 C275 205, 255 208, 250 208 C245 208, 225 205, 210 185 Z" />
  </g>

  <!-- Decorative Accent Line left -->
  <line x1="40" y1="345" x2="160" y2="345" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
  
  <!-- BARBAS Text -->
  <text x="250" y="340" text-anchor="middle" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="52" letter-spacing="4" fill="currentColor">
    BARBAS
  </text>

  <!-- BARBER STUDIO Subtitle -->
  <text x="250" y="372" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="19" letter-spacing="9" fill="url(#goldGradient)">
    BARBER STUDIO
  </text>

  <!-- CUTS Text -->
  <text x="250" y="440" text-anchor="middle" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="62" letter-spacing="6" fill="currentColor">
    CUTS
  </text>

  <!-- Decorative Accent Line right -->
  <line x1="340" y1="345" x2="460" y2="345" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
</svg>
